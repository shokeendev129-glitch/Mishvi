<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mishtuflix ❤️</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --nf-red: #E50914;
    --nf-black: #141414;
    --nf-gray: #808080;
  }

  body {
    background: var(--nf-black);
    color: #fff;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ---------- FLOATING HEARTS BACKGROUND ---------- */
  .heart-float {
    position: fixed;
    bottom: -40px;
    font-size: 1.4rem;
    opacity: .35;
    animation: floatUp linear infinite;
    pointer-events: none;
    z-index: 1;
  }
  @keyframes floatUp {
    to { transform: translateY(-115vh) rotate(20deg); opacity: 0; }
  }

  /* ---------- PROFILE SELECT SCREEN ---------- */
  #profileScreen {
    position: relative;
    z-index: 2;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 36px;
    animation: fadeIn .6s ease;
    text-align: center;
    padding: 20px;
  }

  .logo {
    color: var(--nf-red);
    font-size: clamp(2.4rem, 7vw, 4rem);
    font-weight: 800;
    letter-spacing: -1px;
    text-shadow: 0 2px 12px rgba(229, 9, 20, .45);
  }

  #profileScreen h1 { font-weight: 400; font-size: clamp(1.3rem, 4vw, 2.1rem); }
  #profileScreen .sub { color: var(--nf-gray); font-size: 1rem; margin-top: -22px; }

  .profiles { display: flex; gap: 32px; flex-wrap: wrap; justify-content: center; }

  .profile {
    background: none; border: none; cursor: pointer;
    color: var(--nf-gray);
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    transition: color .2s;
  }

  .profile .avatar {
    width: clamp(110px, 22vw, 160px);
    height: clamp(110px, 22vw, 160px);
    border-radius: 6px;
    border: 3px solid transparent;
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(2.6rem, 6vw, 4rem);
    transition: border-color .2s, transform .2s;
  }

  .profile:hover, .profile:focus-visible { color: #fff; outline: none; }
  .profile:hover .avatar, .profile:focus-visible .avatar {
    border-color: #fff; transform: scale(1.05);
  }

  .avatar.a1 { background: linear-gradient(135deg, #E50914, #ff6b81); }
  .avatar.a2 { background: linear-gradient(135deg, #ff2e63, #ff9a8b); }
  .avatar.a3 { background: linear-gradient(135deg, #5b2a86, #ff6b81); }
  .avatar.a4 { background: linear-gradient(135deg, #0b3d91, #4aa3ff); }

  /* ---------- OBVIOUS THING: intro + text cards + outro ---------- */
  #introScreen {
    display: none; position: fixed; inset: 0; z-index: 5000;
    background: #000; flex-direction: column; align-items: center; justify-content: center;
    gap: 22px; text-align: center; padding: 24px;
  }
  #introScreen.active { display: flex; animation: fadeIn .8s ease; }
  #introScreen .line {
    font-size: clamp(1.3rem, 5vw, 2.2rem); opacity: 0;
    animation: lineIn 1s ease forwards;
  }
  #introScreen .line.big { color: #ff6b81; font-weight: 700; }
  #introScreen .l1 { animation-delay: .6s; }
  #introScreen .l2 { animation-delay: 2.4s; }
  #introScreen .l3 { animation-delay: 4.2s; }
  #introScreen .l4 { animation-delay: 6s; }
  #introScreen button {
    opacity: 0; animation: lineIn 1s ease 7.8s forwards;
    background: var(--nf-red); color: #fff; border: none; border-radius: 4px;
    padding: 12px 28px; font-size: 1rem; cursor: pointer; margin-top: 10px;
  }
  @keyframes lineIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  .card.text-card {
    background: linear-gradient(135deg, #2b1030, #5a1a3a);
    color: #fff; font-size: .95rem; line-height: 1.4; padding: 14px;
    text-align: center; cursor: default;
  }
  .card.text-card:hover { transform: none; }
  .card.text-card:hover::after { content: none; }
  .card.text-card.tbc { background: linear-gradient(135deg, #E50914, #7a0a3a); font-weight: 700; font-size: 1.15rem; }

  #introCollage { position: absolute; inset: 0; overflow: hidden; padding: 8px; columns: 3; column-gap: 8px; }
  @media (min-width: 700px)  { #introCollage { columns: 5; } }
  @media (min-width: 1100px) { #introCollage { columns: 7; } }
  #introCollage img { width: 100%; display: block; margin-bottom: 8px; border-radius: 6px; break-inside: avoid; opacity: 0; animation: fadeIn .8s ease forwards; }
  #introScreen::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(0,0,0,.72), rgba(0,0,0,.88)); z-index: 1; }
  #introScreen .msg {
    position: relative; z-index: 2; max-width: 520px; max-height: 88vh; overflow-y: auto;
    padding: 28px 24px; text-align: center; border-radius: 12px;
    background: rgba(10,10,10,.55); backdrop-filter: blur(4px);
    display: flex; flex-direction: column; gap: 16px; align-items: center;
  }
  #introScreen .msg .m { opacity: 0; font-size: clamp(1.05rem, 4.2vw, 1.4rem); line-height: 1.5; animation: lineIn 1s ease forwards; }
  #introScreen .msg .m.name { color: #ff6b81; font-weight: 700; }
  #introScreen .msg .m.last { font-size: clamp(1.6rem, 7vw, 2.4rem); font-weight: 800; color: #ff6b81; text-shadow: 0 2px 14px rgba(229,9,20,.5); }
  #introScreen .msg button { opacity: 0; animation: lineIn 1s ease 11s forwards; }
  #introScreen .msg .m.pink { color: #ff6b81; font-weight: 700; }
  #introScreen .msg .m.small { font-size: clamp(.95rem, 3.7vw, 1.15rem); }
  #introScreen .msg .m.small, #introScreen .msg .m { overflow-wrap: anywhere; }

  /* ---------- PIN MODAL ---------- */
  #pinModal { display: none; position: fixed; inset: 0; z-index: 7000; background: rgba(0,0,0,.92); align-items: center; justify-content: center; }
  #pinModal.active { display: flex; animation: fadeIn .25s ease; }
  .pin-box { text-align: center; padding: 24px; width: min(92vw, 340px); }
  .pin-title { font-size: 1.5rem; font-weight: 700; }
  .pin-sub { color: var(--nf-gray); margin: 6px 0 18px; }
  .pin-dots { display: flex; gap: 12px; justify-content: center; margin-bottom: 10px; }
  .pin-dots span { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #888; transition: background .15s; }
  .pin-dots span.on { background: #ff6b81; border-color: #ff6b81; }
  .pin-dots.shake { animation: shake .4s; }
  @keyframes shake { 20%,60% { transform: translateX(-8px); } 40%,80% { transform: translateX(8px); } }
  .pin-msg { min-height: 1.4em; color: #ff6b81; font-size: .9rem; margin-bottom: 8px; }
  .pin-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .pin-pad button { background: #222; color: #fff; border: 1px solid #333; border-radius: 50%; aspect-ratio: 1; font-size: 1.4rem; cursor: pointer; }
  .pin-pad button:active { background: #444; }
  .pin-cancel { background: none; border: none; color: var(--nf-gray); margin-top: 18px; cursor: pointer; font-size: .95rem; }

  /* ---------- STORIES ---------- */
  .story-row { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
  .story-btn { background: none; border: none; color: #fff; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: .8rem; }
  .story-ring { width: 66px; height: 66px; border-radius: 50%; padding: 3px; background: linear-gradient(45deg, #feda75, #fa7e1e, #d62976, #962fbf, #4f5bd5); }
  .story-btn.seen .story-ring { background: #555; }
  .story-ring div { width: 100%; height: 100%; border-radius: 50%; background: #1a1a1a; border: 3px solid #000; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; font-weight: 700; }
  #storyViewer { display: none; position: fixed; inset: 0; z-index: 6000; background: #000; flex-direction: column; }
  #storyViewer.active { display: flex; }
  #storyBars { display: flex; gap: 4px; padding: 10px 10px 6px; position: relative; z-index: 3; }
  #storyBars .bar { flex: 1; height: 3px; background: rgba(255,255,255,.3); border-radius: 2px; overflow: hidden; }
  #storyBars .bar i { display: block; height: 100%; width: 0; background: #fff; }
  #storyHead { display: flex; justify-content: space-between; align-items: center; padding: 6px 14px; position: relative; z-index: 3; font-weight: 700; }
  #storyHead button { background: none; border: none; color: #fff; font-size: 2rem; cursor: pointer; line-height: 1; }
  #storyMedia { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  #storyMedia img, #storyMedia video { max-width: 100vw; max-height: 100vh; object-fit: contain; }
  #storyMedia .ph { color: #aaa; text-align: center; padding: 30px; line-height: 1.6; }
  #storyTapL, #storyTapR { position: absolute; top: 60px; bottom: 0; width: 35%; z-index: 2; }
  #storyTapL { left: 0; } #storyTapR { right: 0; width: 65%; }

  .collage-wrap { padding: 24px 4vw 8px; }
  .collage-wrap h3 { font-size: 1.2rem; margin-bottom: 14px; font-weight: 600; }
  .collage { columns: 2; column-gap: 8px; }
  @media (min-width: 700px)  { .collage { columns: 3; } }
  @media (min-width: 1100px) { .collage { columns: 5; } }
  .collage img {
    width: 100%; display: block; margin-bottom: 8px; border-radius: 6px;
    break-inside: avoid; cursor: pointer; transition: transform .25s, filter .25s;
    opacity: 0; animation: fadeIn .6s ease forwards;
  }
  .collage img:hover { transform: scale(1.03); filter: brightness(1.1); }

  .outro { text-align: center; padding: 40px 4vw 90px; color: #ffd7dd; font-size: 1.05rem; line-height: 1.7; }
  .outro .big { color: #ff6b81; font-weight: 700; font-size: 1.3rem; }

  .profile span { font-size: 1.05rem; letter-spacing: .5px; }

  /* ---------- BROWSE SCREEN ---------- */
  #browseScreen { display: none; position: relative; z-index: 2; animation: fadeIn .6s ease; }

  header {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 4vw;
    background: linear-gradient(to bottom, rgba(0,0,0,.85), rgba(20,20,20,.6));
    backdrop-filter: blur(6px);
  }
  header .logo { font-size: 1.5rem; }

  .back-btn {
    background: transparent; border: 1px solid var(--nf-gray); color: #fff;
    padding: 8px 16px; border-radius: 4px; cursor: pointer; font-size: .9rem;
    transition: background .2s;
  }
  .back-btn:hover { background: rgba(255,255,255,.15); }

  .hero {
    padding: 10vh 4vw 6vh;
    background:
      linear-gradient(to top, var(--nf-black) 5%, transparent 60%),
      linear-gradient(120deg, rgba(229,9,20,.4), rgba(255,46,99,.25), rgba(20,20,20,.9));
  }

  .hero .tag {
    color: #ff6b81; font-weight: 700; letter-spacing: 3px;
    font-size: .8rem; text-transform: uppercase;
  }
  .hero h2 { font-size: clamp(2rem, 6vw, 3.4rem); margin: 10px 0 14px; }
  .hero p { max-width: 560px; color: #ffd7dd; line-height: 1.5; }

  .row { padding: 24px 4vw 8px; }
  .row h3 { font-size: 1.2rem; margin-bottom: 14px; font-weight: 600; }

  .cards {
    display: flex; gap: 14px; overflow-x: auto; padding-bottom: 18px;
    scrollbar-width: thin; scrollbar-color: #333 transparent;
    align-items: flex-start;
  }

  .card-wrap {
    flex: 0 0 auto;
    width: clamp(180px, 42vw, 260px);
  }

  .card {
    position: relative;
    width: 100%;
    aspect-ratio: 16/10;
    border-radius: 6px;
    background: #2a2a2a;
    background-size: cover; background-position: center;
    display: flex; align-items: center; justify-content: center;
    font-size: .8rem; color: #888;
    cursor: pointer;
    transition: transform .25s;
    overflow: hidden;
  }
  .card video { width: 100%; height: 100%; object-fit: cover; }
  .card:hover { transform: scale(1.05); z-index: 2; }
  .card:hover::after {
    content: "❤️";
    position: absolute; top: 6px; right: 8px; font-size: 1rem;
    animation: pop .3s ease;
  }
  @keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }

  .caption {
    margin-top: 8px;
    font-size: .82rem;
    line-height: 1.45;
    color: #d8d8d8;
  }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
    .heart-float { display: none; }
  }

.zoom-modal{
  display:none;position:fixed;inset:0;z-index:9999;
  background:rgba(0,0,0,.96);
  justify-content:center;align-items:center;
  animation: fadeIn .25s ease;
}
.zoom-modal.active{ display:flex; }
.zoom-modal img, .zoom-modal video{
  max-width:94vw;max-height:92vh;object-fit:contain;
  border-radius:8px;
  box-shadow: 0 0 40px rgba(229,9,20,.25);
}
.zoom-modal .close{
  position:absolute;top:18px;right:26px;font-size:2.4rem;color:#fff;
  cursor:pointer;background:none;border:none;z-index:10000;
  transition: transform .2s;
  line-height: 1;
}
.zoom-modal .close:hover{ transform: scale(1.2); color: var(--nf-red); }

</style>
</head>

          { src: "birthday/photos/july1.jpg", caption: "And we're still going" }
        ]
      },
      {
        name: "Up Next: Our Next Chapter",
        items: [
          { text: "📞 Calls, every day — even the boring ones" },
          { text: "✈️ Visits, the moment we can" },

        ]
      }
    ],
    collage: true,
    outro: ["No question today.", "Just us, always.", "I love you, Mishtu. 🤍"]
  };

  /* Profile music mapping */
  /* 🎵 To use a different song for Obvious Thing: put the mp3 in birthday/photos/
     and change OBVIOUS_SONG below, e.g. "birthday/photos/obvious.mp3" */
  const OBVIOUS_SONG = "birthday/photos/our-song.mp3";
  const profileMusic = {
    p2425: "birthday/photos/song-2024-25.mp3",
    p2026: "birthday/photos/2026.mp3",
    pObvious: OBVIOUS_SONG
  };

  function openProfile(id) {
    const s = seasons[id];
    document.getElementById("heroTitle").textContent = s.title;
    document.getElementById("heroText").textContent = s.text;

    /* Play profile-specific music */
    const bgMusic = document.getElementById("bgMusic");
    if (profileMusic[id]) {
      bgMusic.src = profileMusic[id];
      bgMusic.play();
    }

    const rows = document.getElementById("rows");
    rows.innerHTML = "";
    s.headings.forEach(section => {
      const row = document.createElement("div");
      row.className = "row";
      const h = document.createElement("h3");
      h.textContent = "💗 " + section.name;
      row.appendChild(h);

      const cards = document.createElement("div");
      cards.className = "cards";

      section.items.forEach(item => {
        const wrap = document.createElement("div");
        wrap.className = "card-wrap";

        const card = document.createElement("div");
        card.className = "card";

        if (item.text) {
          card.classList.add("text-card");
          if (item.tbc) card.classList.add("tbc");
          card.textContent = item.text;
        } else if (item.src && item.video) {
          const v = document.createElement("video");
          v.src = item.src;
          v.muted = true;
          v.playsInline = true;
          v.style.width = "100%";
          v.style.height = "100%";
          v.style.objectFit = "cover";
          v.style.cursor = "pointer";
          v.onclick = (e) => {
            e.stopPropagation();
            openZoom(item.src, true);
          };
          card.appendChild(v);
        } else if (item.src) {
          const img = document.createElement("img");
          img.src = item.src;
          img.style.width = "100%";
          img.style.height = "100%";
          img.style.objectFit = "cover";
          img.style.cursor = "pointer";
          img.onclick = () => {
            openZoom(item.src, false);
          };
          card.appendChild(img);
        } else {
          card.textContent = item.video ? "Add video 🎬💕" : "Add photo 💕";
        }
        wrap.appendChild(card);

        if (item.caption) {
          const cap = document.createElement("p");
          cap.className = "caption";
          cap.textContent = item.caption;
          wrap.appendChild(cap);
        }
        cards.appendChild(wrap);
      });

      row.appendChild(cards);
      rows.appendChild(row);
    });

    if (s.collage) {
      const wrapC = document.createElement("div");
      wrapC.className = "collage-wrap";
      const hc = document.createElement("h3");
      hc.textContent = "💗 Our Collage";
      wrapC.appendChild(hc);
      const grid = document.createElement("div");
      grid.className = "collage";
      let n = 0;
      ["p2425", "p2026"].forEach(k => {
        seasons[k].headings.forEach(sec => {
          sec.items.forEach(it => {
            if (it.src && !it.video) {
              const im = document.createElement("img");
              im.src = it.src;
              im.loading = "lazy";
              im.style.animationDelay = (n++ * 0.06) + "s";
              im.onclick = () => openZoom(it.src, false);
              grid.appendChild(im);
            }
          });
        });
      });
      wrapC.appendChild(grid);
      rows.appendChild(wrapC);
    }
    if (s.outro) {
      const o = document.createElement("div");
      o.className = "outro";
      o.innerHTML = "";
      s.outro.forEach((t, i) => {
        const d = document.createElement("div");
        if (i === 1) d.className = "big";
        d.textContent = t;
        o.appendChild(d);
      });
      rows.appendChild(o);
    }
    const intro = document.getElementById("introScreen");
    if (s.intro) {
      showIntroPage(0);
      const ic = document.getElementById("introCollage");
      ic.innerHTML = "";
      let k = 0;
      ["p2425", "p2026"].forEach(key => seasons[key].headings.forEach(sec => sec.items.forEach(it => {
        if (it.src && !it.video) {
          const im = document.createElement("img");
          im.src = it.src;
          im.style.animationDelay = (k++ * 0.08) + "s";
          ic.appendChild(im);
        }
      })));
      intro.classList.remove("active"); void intro.offsetWidth; intro.classList.add("active");
    }

    document.getElementById("profileScreen").style.display = "none";
    document.getElementById("browseScreen").style.display = "block";
    window.scrollTo(0, 0);
  }

  const introPages = [
    [
      { t: "Sorry Mishtu,", c: "name" },
      { t: "I have let you down so much in these 8 months. I always thought this proposal should be memorable, and I didn't initiate anything. I am so sorry. I don't even know how you have been convincing yourself for so many months. All I have done is let you down. I can't see you lose faith in me." }
    ],
    [
      { t: "I LOVE YOU with every inch of myself 🤍", c: "pink" },
      { t: "I am too afraid, and even more so proud of you, my nonnu. I am with you at every step, I am here for the long run.", c: "small" },
      { t: "No amount of words can describe how special you make me feel.", c: "small" },
      { t: "Bohot hogyi english 😅", c: "small" },
      { t: "Mei bohot shy hu aisi cheezo mei, rona bohot kam krdia tha recently kyu ki merko laga tu merko kam manly samjhegi.", c: "small" },
      { t: "Lekin jab baat teri aati hai meri saari ego ek side hojati hai, aisa lagta hai mera dil mere khud se naraaz hai. Shakal surat toh alag hi hai Mishtu, tu dil ki itni saaf aur achi hai. Mere toh kasam se bhaag hi khul gye jabse tu mili. Meine kuch kiya ho ya na ho, tere peeche padh ke tereko manaiya, mera isse badia decision koi kuch ni ho skta tha.", c: "small" },
      { t: "At any point of life tereko pyaar ki kami feel ho, remember yaha pa ek deewana baitha hai jo tere bolne par kuch bhi krdega.", c: "small" },
      { t: "2 months mt bola kr ab tu toh fass gyi mere saath ab kahi ni ja ri beti 😘", c: "small" },
      { t: "I love you Mishti Sethi, I so so love you, I am so proud of you. 🤍", c: "pink" }
    ],
    [
      { t: "AND REMEMBER", c: "name" },
      { t: "YOU ARE MY GIRLFRIEND 🤍", c: "last" }
    ],
    [
      { t: "If you forgive me and want to give me one more chance, you can open the surprise profile. 🤍", c: "pink" },
      { t: "If not, it's still okay. I am the one who made it so worse." },
      { t: "I love you nonne ❤️", c: "pink" },
      { t: "Yours and only yoursss,", c: "small" },
      { t: "Deviii 😘", c: "name" }
    ]
  ];

  function showIntroPage(i) {
    const box = document.getElementById("introMsg");
    box.innerHTML = "";
    box.scrollTop = 0;
    let delay = 0.5;
    introPages[i].forEach(line => {
      const d = document.createElement("div");
      d.className = "m" + (line.c ? " " + line.c : "");
      d.textContent = line.t;
      d.style.animationDelay = delay + "s";
      delay += line.t.length > 150 ? 2.6 : (line.t.length > 60 ? 1.8 : 1.3);
      box.appendChild(d);
    });
    const btn = document.createElement("button");
    const last = i === introPages.length - 1;
    btn.textContent = last ? "Continue ▶" : "Next ▶";
    btn.style.animationDelay = (delay + 0.3) + "s";
    btn.onclick = () => last ? closeIntro() : showIntroPage(i + 1);
    box.appendChild(btn);
  }

  /* ============================================================
     🔒 NOICE, TOIT: PIN-locked profile
     Put story videos/photos in birthday/stories/ and edit the
     names / file paths in noiceStories below.
     ============================================================ */
  const NOICE_SONG = "birthday/photos/noice-toit.mp3";
  const PIN_HASH = "3a531cefd31e8c3a2b7c38def595bdec5f9f68b10a676998fe60765b29426208";
  const noiceStories = [
    { name: "Gur",      items: [{ src: "birthday/stories/gur1.mp4",      video: true }] },
    { name: "Aarya",    items: [{ src: "birthday/stories/aarya1.mp4",    video: true }] },
    { name: "Avneet",   items: [{ src: "birthday/stories/avneet1.mp4",   video: true }] },
    { name: "Kavyansh", items: [{ src: "birthday/stories/kavyansh1.mp4", video: true }] },
    { name: "Secret ID", items: [{ src: "birthday/stories/secret1.mp4",  video: true }] }
  ];
  const noicePages = [
    { lines: [
      { t: "Noice. Toit. 😎", c: "last" },
      { t: "I have been a huge Brooklyn Nine-Nine fan." },
      { t: "You are Amy to my Jake.", c: "pink" },
      { t: "You are the one who keeps me sane." },
      { t: "You are the one who makes me feel smart, needed, loved. 🤍", c: "pink" }
    ] },
    { lines: [
      { t: "Mishti Sethi 🤍", c: "name" },
      { t: "Watch Insta Stories of" },
      { t: "Gur, Aarya, Avneet, Kavyansh, Secret ID", c: "pink" }
    ], after: [
      { t: "Ik you said no, but I couldn't have let you go without this. It would have been the last disrespect I gave to our relationship.", c: "small" }
    ] }
  ];

  let pinVal = "";
  function askPin() {
    pinVal = "";
    updatePinDots();
    document.getElementById("pinMsg").textContent = "";
    const pad = document.getElementById("pinPad");
    if (!pad.children.length) {
      ["1","2","3","4","5","6","7","8","9","","0","⌫"].forEach(k => {
        const b = document.createElement("button");
        if (k === "") { b.style.visibility = "hidden"; }
        b.textContent = k;
        b.onclick = () => pinKey(k);
        pad.appendChild(b);
      });
    }
    document.getElementById("pinModal").classList.add("active");
  }
  function closePin() { document.getElementById("pinModal").classList.remove("active"); }
  function updatePinDots() {
    document.querySelectorAll("#pinDots span").forEach((d, i) => d.classList.toggle("on", i < pinVal.length));
  }
  function pinKey(k) {
    if (k === "⌫") pinVal = pinVal.slice(0, -1);
    else if (/^[0-9]$/.test(k) && pinVal.length < 6) pinVal += k;
    updatePinDots();
    if (pinVal.length === 6) checkPin();
  }
  async function checkPin() {
    const msg = document.getElementById("pinMsg");
    let ok = false;
    try {
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("mishtu-noice:" + pinVal));
      const hex = Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
      ok = hex === PIN_HASH;
    } catch (e) {
      msg.textContent = "Please open this site over https 🔒";
      pinVal = ""; updatePinDots(); return;
    }
    if (ok) { closePin(); openNoice(); return; }
    msg.textContent = "Wrong PIN 🙈 Try again";
    const dots = document.getElementById("pinDots");
    dots.classList.remove("shake"); void dots.offsetWidth; dots.classList.add("shake");
    pinVal = ""; updatePinDots();
  }
  document.addEventListener("keydown", e => {
    if (document.getElementById("pinModal").classList.contains("active")) {
      if (e.key === "Backspace") pinKey("⌫");
      else if (/^[0-9]$/.test(e.key)) pinKey(e.key);
      else if (e.key === "Escape") closePin();
    } else if (document.getElementById("storyViewer").classList.contains("active")) {
      if (e.key === "ArrowRight") nextStory();
      else if (e.key === "ArrowLeft") prevStory();
      else if (e.key === "Escape") closeStory();
    }
  });

  const seenStories = new Set();
  function openNoice() {
    seenStories.clear();
    const bgMusic = document.getElementById("bgMusic");
    bgMusic.src = NOICE_SONG;
    bgMusic.play().catch(() => {});
    const ic = document.getElementById("introCollage");
    ic.innerHTML = "";
    let k = 0;
    ["p2425", "p2026"].forEach(key => seasons[key].headings.forEach(sec => sec.items.forEach(it => {
      if (it.src && !it.video) {
        const im = document.createElement("img");
        im.src = it.src;
        im.style.animationDelay = (k++ * 0.08) + "s";
        ic.appendChild(im);
      }
    })));
    document.getElementById("profileScreen").style.display = "none";
    const intro = document.getElementById("introScreen");
    intro.classList.remove("active"); void intro.offsetWidth; intro.classList.add("active");
    showNoicePage(0);
  }

  function showNoicePage(i) {
    const page = noicePages[i];
    const box = document.getElementById("introMsg");
    box.innerHTML = "";
    box.scrollTop = 0;
    let delay = 0.5;
    const addLines = arr => arr.forEach(line => {
      const d = document.createElement("div");
      d.className = "m" + (line.c ? " " + line.c : "");
      d.textContent = line.t;
      d.style.animationDelay = delay + "s";
      delay += line.t.length > 100 ? 2.4 : (line.t.length > 50 ? 1.8 : 1.3);
      box.appendChild(d);
    });
    addLines(page.lines);
    if (page.stories) {
      const row = document.createElement("div");
      row.className = "m story-row";
      row.style.animationDelay = delay + "s";
      delay += 1.3;
      noiceStories.forEach((u, idx) => {
        const b = document.createElement("button");
        b.className = "story-btn" + (seenStories.has(idx) ? " seen" : "");
        b.innerHTML = '<div class="story-ring"><div>' + (u.name === "Secret ID" ? "🤫" : u.name[0]) + '</div></div><span>' + u.name + '</span>';
        b.onclick = () => openStory(idx);
        row.appendChild(b);
      });
      box.appendChild(row);
    }
    if (page.after) addLines(page.after);
    const btn = document.createElement("button");
    const last = i === noicePages.length - 1;
    btn.textContent = last ? "Done ▶" : "Next ▶";
    btn.style.animationDelay = (delay + 0.3) + "s";
    btn.onclick = () => {
      if (last) {
        document.getElementById("introScreen").classList.remove("active");
        document.getElementById("profileScreen").style.display = "flex";
      } else showNoicePage(i + 1);
    };
    box.appendChild(btn);
  }

  /* ---------- Story viewer ---------- */
  const sv = { u: 0, i: 0, timer: null, musicWasOn: false };
  function openStory(u) {
    sv.u = u; sv.i = 0;
    const bg = document.getElementById("bgMusic");
    sv.musicWasOn = !bg.paused;
    bg.pause();
    document.getElementById("storyViewer").classList.add("active");
    renderStory();
  }
  function renderStory() {
    clearTimeout(sv.timer);
    const user = noiceStories[sv.u];
    const it = user.items[sv.i];
    document.getElementById("storyName").textContent = user.name === "Secret ID" ? "🤫 Secret ID" : user.name;
    const bars = document.getElementById("storyBars");
    bars.innerHTML = "";
    const fills = user.items.map((_, n) => {
      const bar = document.createElement("div"); bar.className = "bar";
      const f = document.createElement("i");
      if (n < sv.i) f.style.width = "100%";
      bar.appendChild(f); bars.appendChild(bar);
      return f;
    });
    const cur = fills[sv.i];
    const media = document.getElementById("storyMedia");
    media.innerHTML = "";
    const placeholder = () => {
      media.innerHTML = '<div class="ph">Story coming soon 💕<br>(' + user.name + ")</div>";
      runTimer(cur, 4);
    };
    function runTimer(f, secs) {
      f.style.transition = "none"; f.style.width = "0";
      void f.offsetWidth;
      f.style.transition = "width " + secs + "s linear"; f.style.width = "100%";
      sv.timer = setTimeout(nextStory, secs * 1000);
    }
    if (!it || !it.src) { placeholder(); return; }
    if (it.video) {
      const v = document.createElement("video");
      v.src = it.src; v.autoplay = true; v.playsInline = true;
      v.onerror = placeholder;
      v.ontimeupdate = () => { if (v.duration) cur.style.width = (v.currentTime / v.duration * 100) + "%"; };
      v.onended = nextStory;
      media.appendChild(v);
      v.play().catch(() => {});
    } else {
      const im = document.createElement("img");
      im.src = it.src; im.onerror = placeholder;
      im.onload = () => runTimer(cur, 5);
      media.appendChild(im);
    }
  }
  function nextStory() {
    const user = noiceStories[sv.u];
    if (sv.i < user.items.length - 1) { sv.i++; renderStory(); return; }
    seenStories.add(sv.u);
    if (sv.u < noiceStories.length - 1) { sv.u++; sv.i = 0; renderStory(); }
    else closeStory();
  }
  function prevStory() {
    if (sv.i > 0) { sv.i--; renderStory(); }
    else if (sv.u > 0) { sv.u--; sv.i = 0; renderStory(); }
    else renderStory();
  }
  function closeStory() {
    clearTimeout(sv.timer);
    const media = document.getElementById("storyMedia");
    media.querySelectorAll("video").forEach(v => v.pause());
    media.innerHTML = "";
    document.getElementById("storyViewer").classList.remove("active");
    document.querySelectorAll(".story-btn").forEach((b, idx) => b.classList.toggle("seen", seenStories.has(idx)));
    if (sv.musicWasOn) document.getElementById("bgMusic").play().catch(() => {});
  }

  function closeIntro() {
    document.getElementById("introScreen").classList.remove("active");
  }

  function goHome() {
    document.getElementById("browseScreen").style.display = "none";
    document.getElementById("profileScreen").style.display = "flex";
  }

  /* Floating hearts background */
  const HEARTS = ["❤️", "💖", "💕", "💗", "💘"];
  for (let i = 0; i < 14; i++) {
    const h = document.createElement("div");
    h.className = "heart-float";
    h.textContent = HEARTS[i % HEARTS.length];
    h.style.left = Math.random() * 100 + "vw";
    h.style.animationDuration = 9 + Math.random() * 10 + "s";
    h.style.animationDelay = -Math.random() * 12 + "s";
    h.style.fontSize = 0.9 + Math.random() * 1.2 + "rem";
    document.body.appendChild(h);
  }


function openZoom(src, isVideo){
  const modal = document.getElementById("zoomModal");
  const zoomImg = document.getElementById("zoomImg");
  const zoomVideo = document.getElementById("zoomVideo");
  if(isVideo){
    zoomVideo.src = src;
    zoomVideo.style.display = "block";
    zoomImg.style.display = "none";
    modal.classList.add("active");
    zoomVideo.currentTime = 0;
    zoomVideo.muted = false;
    zoomVideo.play();
  } else {
    zoomImg.src = src;
    zoomImg.style.display = "block";
    zoomVideo.style.display = "none";
    modal.classList.add("active");
  }
}

function closeZoom(){
  const modal = document.getElementById("zoomModal");
  const zoomVideo = document.getElementById("zoomVideo");
  zoomVideo.pause();
  zoomVideo.src = "";
  modal.classList.remove("active");
}

document.addEventListener("DOMContentLoaded", function(){
  const zoomModal = document.getElementById("zoomModal");
  zoomModal.addEventListener("click", function(e){
    if(e.target === zoomModal) closeZoom();
  });
});

</script>

<div id="zoomModal" class="zoom-modal">
<button class="close" onclick="closeZoom()">&times;</button>
<img id="zoomImg" src="" style="display:none;">
<video id="zoomVideo" controls playsinline style="display:none;"></video>
</div>
